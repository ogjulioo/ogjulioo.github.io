<style>

<script>
const DATA={"P": [{"n": 1, "tema": "Desinformação e checagem de fatos", "textos": [{"label": "Texto 1", "titulo": "Antes de compartilhar, confira", "autor": "Por Marcos Vieira, jornalista (Opinião)", "paras": ["Basta um toque na tela para que uma notícia percorra o país em poucos minutos. O problema é que, muitas vezes, essa notícia nem sequer é verdadeira. Em plena era digital, a desinformação tornou-se um dos maiores desafios da democracia, porque ela confunde o cidadão, ameaça a saúde pública e fragiliza a confiança nas instituições.", "Uma pesquisa divulgada neste ano por um instituto de opinião revelou que 6 em cada 10 brasileiros já acreditaram em uma informação falsa e a repassaram aos amigos. Entre os jovens de 16 a 24 anos, o índice chegou a 72%. Os números mostram que o hábito de compartilhar sem conferir está disseminado.", "Há, entretanto, quem defenda que a culpa é apenas das plataformas digitais. Embora elas tenham grande responsabilidade, o leitor também precisa assumir o seu papel. Antes de repassar uma mensagem, é recomendável verificar a fonte, procurar a data da publicação e comparar o conteúdo com o de veículos confiáveis.", "Nesse cenário, a escola ocupa lugar decisivo. Se os estudantes aprenderem a analisar criticamente o que leem, tornar-se-ão cidadãos menos vulneráveis às mentiras que circulam na internet. Por isso, a educação midiática deveria ser tratada como prioridade nas políticas públicas.", "Em suma, combater a desinformação exige esforço conjunto: plataformas que removam conteúdos enganosos, governos que garantam leis eficazes e cidadãos que duvidem antes de compartilhar. Afinal, a liberdade de se informar só é plena quando a informação é verdadeira."]}, {"label": "Texto 2", "titulo": "Charge (descrição da imagem)", "autor": "", "paras": ["Dois jovens estão sentados em um sofá, cada um com o celular na mão. O primeiro diz: “Li num grupo que beber água com sal cura tudo!”. O segundo pergunta, sem tirar os olhos da tela: “Sério? Quem disse isso?”. O primeiro responde: “Ninguém sabe, mas já tem 3 mil compartilhamentos!”."]}], "qs": [{"q": "A leitura do Texto 1 permite inferir que", "pre": "", "o": ["as plataformas digitais são as únicas responsáveis pela circulação de informações falsas.", "o hábito de repassar mensagens sem checá-las contribui para a disseminação da desinformação.", "os jovens estão menos expostos às mentiras que circulam na internet.", "a escola tem pouca influência na formação de leitores críticos."], "a": 1, "e": "O texto afirma que o leitor também precisa assumir seu papel e que o hábito de compartilhar sem conferir está disseminado. A) contradiz o 3º parágrafo (“apenas das plataformas”); C) contradiz os 72% entre jovens; D) contradiz o 4º parágrafo, que dá à escola um “lugar decisivo”.", "c": "I"}, {"q": "No último parágrafo do Texto 1, predomina a", "pre": "", "o": ["narração, pois os fatos são apresentados em ordem cronológica.", "descrição, pois as características de um objeto são detalhadas.", "argumentação, pois há um posicionamento conclusivo do autor.", "injunção, pois há uma sequência de instruções ao leitor."], "a": 2, "e": "O parágrafo retoma as ideias e conclui com posicionamento (“Em suma… Afinal…”). Não há sequência temporal de fatos (narração), nem caracterização de um objeto (descrição), nem instruções passo a passo (injunção).", "c": "G"}, {"q": "A intenção comunicativa predominante do Texto 1 é", "pre": "", "o": ["narrar um caso real de notícia falsa que circulou no país.", "informar, sem tomar partido, os resultados de uma pesquisa de opinião.", "ensinar, passo a passo, como criar conteúdos para a internet.", "defender que o combate à desinformação depende do esforço de todos."], "a": 3, "e": "O texto é um artigo de opinião: usa dados como argumento para sustentar a tese de que plataformas, governos, escola e cidadãos devem agir juntos. Os dados da pesquisa servem à argumentação, não são o objetivo final.", "c": "I"}, {"q": "De acordo com o Texto 1,", "pre": "", "o": ["entre os jovens de 16 a 24 anos, o índice de quem já acreditou e repassou informação falsa chega a 72%.", "a verificação da fonte é desnecessária quando a mensagem vem de amigos.", "as plataformas digitais já eliminaram os conteúdos enganosos.", "a educação midiática já é tratada como prioridade nas políticas públicas."], "a": 0, "e": "Informação literal do 2º parágrafo. D) está errada porque o texto diz que ela “deveria ser” prioridade, ou seja, ainda não é.", "c": "I"}, {"q": "Questões 5 a 7 – O termo PORQUE (1) introduz uma ideia de", "pre": "Em plena era digital, a desinformação tornou-se um dos maiores desafios da democracia, porque (1) ela confunde o cidadão (2), ameaça a saúde pública e fragiliza a confiança nas instituições.", "o": ["oposição.", "finalidade.", "condição.", "causa."], "a": 3, "e": "“Porque” apresenta o motivo pelo qual a desinformação é um grande desafio: ela confunde, ameaça e fragiliza. É relação de causa/explicação.", "c": "C"}, {"q": "O trecho é formado por", "pre": "", "o": ["um período simples.", "um período composto por quatro orações.", "dois períodos e quatro orações.", "um período composto por três orações."], "a": 1, "e": "Conte os verbos: (1) tornou-se; (2) confunde; (3) ameaça; (4) fragiliza. São quatro verbos = quatro orações, em um único período (só há um ponto final).", "c": "S"}, {"q": "O termo O CIDADÃO (2) exerce a função sintática de", "pre": "", "o": ["sujeito.", "adjunto adnominal.", "objeto direto.", "complemento nominal."], "a": 2, "e": "“Confunde” é verbo transitivo direto (quem confunde, confunde alguém). “O cidadão” completa o verbo sem preposição: objeto direto. O sujeito é “ela”.", "c": "S"}, {"q": "No Texto 1, são acentuadas pela mesma regra as palavras", "pre": "", "o": ["país e saúde.", "notícia e pública.", "notícia e país.", "saúde e pública."], "a": 0, "e": "País (pa-ís) e saúde (sa-ú-de) têm hiato com i/u tônicos: acentuam-se por essa regra. Notícia é paroxítona terminada em ditongo; pública é proparoxítona (todas são acentuadas).", "c": "A"}, {"q": "Um antônimo para a palavra VULNERÁVEIS (4º parágrafo) é", "pre": "", "o": ["frágeis.", "expostos.", "suscetíveis.", "resistentes."], "a": 3, "e": "Vulnerável = que pode ser facilmente atingido, frágil. O oposto é “resistente”. As demais são sinônimos.", "c": "M"}, {"q": "No 3º parágrafo, o termo ELAS (“Embora elas tenham grande responsabilidade”) retoma", "pre": "", "o": ["as mensagens.", "as plataformas digitais.", "os leitores.", "as instituições."], "a": 1, "e": "O parágrafo começa falando que “a culpa é apenas das plataformas digitais”. O pronome “elas” (feminino plural) retoma esse termo.", "c": "C"}, {"q": "A conjunção EMBORA (3º parágrafo) estabelece relação de", "pre": "", "o": ["conclusão.", "explicação.", "concessão.", "adição."], "a": 2, "e": "“Embora” admite um fato contrário (as plataformas têm responsabilidade) sem anular a ideia principal (o leitor também tem). Isso é concessão.", "c": "C"}, {"q": "No trecho “Há, entretanto, quem defenda que a culpa é apenas das plataformas digitais”, as vírgulas isolam", "pre": "", "o": ["termos de mesma função sintática.", "uma conjunção adversativa deslocada.", "um vocativo.", "uma oração adjetiva explicativa."], "a": 1, "e": "“Entretanto” é conjunção adversativa (= porém) que aparece no meio da oração, por isso fica entre vírgulas.", "c": "P"}, {"q": "No mesmo trecho, o verbo HAVER (“Há”)", "pre": "", "o": ["é impessoal e equivale a “existir”.", "é pessoal e concorda com “quem”.", "indica tempo decorrido.", "é auxiliar e forma tempo composto."], "a": 0, "e": "Haver com sentido de existir é impessoal (não tem sujeito): “Há quem defenda”. Por isso fica sempre na 3ª pessoa do singular.", "c": "V"}, {"q": "A forma verbal TORNAR-SE-ÃO (4º parágrafo) apresenta", "pre": "", "o": ["ênclise.", "próclise.", "mesóclise, pois o verbo está no futuro do presente e não há palavra atrativa.", "ênclise, pois o verbo está no pretérito."], "a": 2, "e": "O pronome está no meio do verbo (tornar-se-ão): mesóclise. Ela ocorre com verbos no futuro do presente ou do pretérito quando não há fator de próclise antes do verbo.", "c": "V"}, {"q": "O propósito comunicativo prioritário do Texto 2 é", "pre": "", "o": ["criticar o hábito de acreditar e compartilhar informações sem verificar a fonte.", "estimular o uso de remédios caseiros.", "informar sobre tratamentos médicos eficazes.", "elogiar a rapidez com que as notícias circulam."], "a": 0, "e": "A charge ironiza a situação: a “prova” de que a informação é verdadeira é o número de compartilhamentos, não a fonte. Há crítica ao hábito de não checar.", "c": "I"}, {"q": "Quanto à linguagem, o Texto 2 apresenta", "pre": "", "o": ["registro formal e técnico.", "variante histórica.", "registro informal, com marcas de oralidade.", "exclusivamente linguagem não verbal."], "a": 2, "e": "Expressões como “Li num grupo” e “Sério?” reproduzem a fala cotidiana. É linguagem coloquial/informal, adequada ao gênero charge.", "c": "L"}, {"q": "Os Textos 1 e 2 têm em comum", "pre": "", "o": ["o gênero textual.", "a tipologia predominante.", "a linguagem não verbal.", "o recorte temático."], "a": 3, "e": "Ambos tratam da desinformação e do compartilhamento irrefletido. O gênero (artigo de opinião × charge) e a tipologia são diferentes.", "c": "I"}, {"q": "O efeito crítico do Texto 2 decorre principalmente", "pre": "", "o": ["da concordância total entre os dois jovens.", "do contraste entre a ausência de uma fonte confiável e o grande número de compartilhamentos.", "da comparação entre remédios naturais e industrializados.", "da divergência de opiniões entre os amigos sobre saúde."], "a": 1, "e": "A fala “Ninguém sabe, mas já tem 3 mil compartilhamentos!” mostra o absurdo: ninguém sabe a origem, mas a informação se espalha. O “mas” marca o contraste que gera a crítica.", "c": "I"}, {"q": "Quanto ao gênero textual, os Textos 1 e 2 são, respectivamente,", "pre": "", "o": ["editorial e cartum.", "notícia e infográfico.", "reportagem e tirinha.", "artigo de opinião e charge."], "a": 3, "e": "O Texto 1 é assinado e defende um ponto de vista (artigo de opinião). O Texto 2 usa humor para criticar um fato atual (charge).", "c": "G"}, {"q": "O vocábulo DESINFORMAÇÃO é formado por", "pre": "", "o": ["composição por justaposição.", "composição por aglutinação.", "derivação prefixal e sufixal.", "derivação parassintética."], "a": 2, "e": "Des- (prefixo) + informa- (radical) + -ção (sufixo). Não é parassintética, pois a palavra poderia surgir em etapas (informar → informação → desinformação).", "c": "F"}, {"q": "Uma notícia falsa foi compartilhada 3.400.000 vezes. Em notação científica, esse número é escrito como", "pre": "", "o": ["34 × 10<sup>5</sup>", "3,4 × 10<sup>7</sup>", "3,4 × 10<sup>6</sup>", "0,34 × 10<sup>6</sup>"], "a": 2, "e": "3.400.000 = 3,4 × 1.000.000 = 3,4 × 10<sup>6</sup>. Na notação científica o coeficiente fica entre 1 e 10; por isso A e D não servem.", "c": "n"}, {"q": "Em uma pesquisa com 1.500 pessoas, 60% disseram já ter acreditado em uma notícia falsa. O número de pessoas que disseram isso foi", "pre": "", "o": ["900.", "750.", "600.", "1.050."], "a": 0, "e": "60% de 1.500 = 0,6 × 1.500 = 900.", "c": "p"}, {"q": "Uma equipe de 4 checadores analisa um lote de notícias em 12 horas. Mantido o ritmo de cada um, 6 checadores analisariam o mesmo lote em", "pre": "", "o": ["6 horas.", "8 horas.", "9 horas.", "18 horas."], "a": 1, "e": "Mais pessoas, menos tempo: grandezas inversamente proporcionais. 4 × 12 = 6 × x → x = 48 ÷ 6 = 8 horas.", "c": "r"}, {"q": "Três perfis de checagem publicam alertas a cada 4, 6 e 10 horas e publicaram juntos às 8h. Os três voltarão a publicar juntos após", "pre": "", "o": ["30 horas.", "40 horas.", "60 horas.", "120 horas."], "a": 2, "e": "Calcula-se o MMC: 4 = 2², 6 = 2·3, 10 = 2·5. MMC = 2² · 3 · 5 = 60 horas.", "c": "m"}, {"q": "Um golpista ofereceu um empréstimo de R$ 2.000,00 a juros simples de 2,5% ao mês, por 8 meses. O valor dos juros é de", "pre": "", "o": ["R$ 300,00.", "R$ 400,00.", "R$ 480,00.", "R$ 2.400,00."], "a": 1, "e": "J = C · i · t = 2.000 × 0,025 × 8 = R$ 400,00. (R$ 2.400,00 é o montante, não os juros.)", "c": "j"}, {"q": "O custo de uma campanha de checagem é dado por C(x) = 300 + 15x, em que x é o número de cartazes impressos. Para 40 cartazes, o custo é de", "pre": "", "o": ["R$ 600,00.", "R$ 750,00.", "R$ 1.200,00.", "R$ 900,00."], "a": 3, "e": "C(40) = 300 + 15 × 40 = 300 + 600 = R$ 900,00.", "c": "f"}, {"q": "Um servidor tem formato de paralelepípedo reto-retângulo com 1,5 m de comprimento, 0,8 m de largura e 2 m de altura. Sua capacidade, em litros, é de", "pre": "", "o": ["2.400.", "240.", "24.000.", "4.300."], "a": 0, "e": "V = 1,5 × 0,8 × 2 = 2,4 m³. Como 1 m³ = 1.000 L, 2,4 m³ = 2.400 L.", "c": "e"}, {"q": "O número de notícias falsas desmentidas por uma agência em cinco dias foi: 12, 18, 15, 20 e 10. A média diária foi de", "pre": "", "o": ["12.", "13.", "14.", "15."], "a": 3, "e": "Soma = 12 + 18 + 15 + 20 + 10 = 75. Média = 75 ÷ 5 = 15.", "c": "t"}, {"q": "Em uma oficina de checagem de notícias com 250 alunos, 2/5 participaram da primeira etapa. O número de alunos que não participaram foi", "pre": "", "o": ["100.", "150.", "125.", "200."], "a": 1, "e": "Não participaram 3/5 do total: 3/5 × 250 = 150. (Ou: 2/5 de 250 = 100 participaram; 250 − 100 = 150.)", "c": "q"}, {"q": "Um cartaz foi desenhado na escala 1 : 25. Se a altura do cartaz no desenho é 4 cm, a altura real é de", "pre": "", "o": ["0,5 m.", "0,16 m.", "1,0 m.", "10 m."], "a": 2, "e": "Altura real = 4 × 25 = 100 cm = 1,0 m.", "c": "q"}, {"q": "Um terreno tem formato de triângulo retângulo com catetos de 9 m e 12 m. Ele será cercado com 3 fios de arame em volta. A quantidade de arame necessária é de", "pre": "", "o": ["108 m.", "36 m.", "72 m.", "135 m."], "a": 0, "e": "Hipotenusa: h² = 9² + 12² = 81 + 144 = 225 → h = 15 m. Perímetro = 9 + 12 + 15 = 36 m. Com 3 fios: 3 × 36 = 108 m.", "c": "g"}, {"q": "Três retas paralelas são cortadas por duas transversais. Na primeira transversal, os segmentos determinados medem 4 cm e 6 cm; na segunda, medem 10 cm e x. O valor de x é", "pre": "", "o": ["9 cm.", "12 cm.", "14 cm.", "15 cm."], "a": 3, "e": "Teorema de Tales: 4/6 = 10/x → 4x = 60 → x = 15 cm.", "c": "g"}, {"q": "Ana compartilhou o triplo de postagens de Bia. Juntas, compartilharam 120 postagens. O número de postagens compartilhadas por Ana foi", "pre": "", "o": ["30.", "60.", "90.", "100."], "a": 2, "e": "Bia = x; Ana = 3x. x + 3x = 120 → 4x = 120 → x = 30. Ana = 3 × 30 = 90.", "c": "x"}, {"q": "Em uma turma de 36 alunos, 24 sempre checam a fonte das notícias. A razão entre o número de alunos que não checam e o total da turma é", "pre": "", "o": ["2/3.", "1/3.", "1/2.", "3/4."], "a": 1, "e": "Não checam: 36 − 24 = 12. Razão = 12/36 = 1/3.", "c": "q"}, {"q": "Uma urna contém 20 cartões: 8 com notícias verdadeiras e 12 com notícias falsas. Sorteando um cartão ao acaso, a probabilidade de ele conter uma notícia falsa é", "pre": "", "o": ["3/5.", "2/5.", "1/2.", "3/8."], "a": 0, "e": "P = casos favoráveis / casos possíveis = 12/20 = 3/5.", "c": "b"}, {"q": "Uma escola vai montar kits iguais, sem sobras, com 48 cartilhas e 72 adesivos, usando o maior número possível de kits. O número de kits será", "pre": "", "o": ["8.", "12.", "18.", "24."], "a": 3, "e": "Pede-se o maior divisor comum: MDC(48, 72) = 24 (48 = 2⁴·3; 72 = 2³·3²; MDC = 2³·3 = 24).", "c": "m"}, {"q": "O alcance de uma postagem era de 200 visualizações. Aumentou 50% e, em seguida, diminuiu 50% sobre o novo valor. O alcance final foi de", "pre": "", "o": ["100.", "150.", "200.", "250."], "a": 1, "e": "200 + 50% = 300. Depois, 300 − 50% = 150. Os percentuais incidem sobre valores diferentes, por isso o resultado não volta a 200.", "c": "p"}, {"q": "Um cartaz circular tem 40 cm de diâmetro. Considerando π = 3,14, sua área, em cm², é de", "pre": "", "o": ["125,6.", "628.", "1.256.", "2.512."], "a": 2, "e": "Raio = 20 cm. A = π · r² = 3,14 × 400 = 1.256 cm².", "c": "g"}, {"q": "Um usuário pode escolher 1 entre 3 redes sociais e 1 entre 4 horários de postagem. O número de combinações possíveis é", "pre": "", "o": ["12.", "7.", "24.", "16."], "a": 0, "e": "Princípio multiplicativo: 3 × 4 = 12.", "c": "b"}, {"q": "Em uma palestra, o ingresso de adulto custou R$ 10,00 e o de estudante, R$ 4,00. Foram vendidos 30 ingressos, arrecadando R$ 180,00. O número de ingressos de adulto vendidos foi", "pre": "", "o": ["6.", "8.", "9.", "10."], "a": 3, "e": "Seja x o número de adultos: 10x + 4(30 − x) = 180 → 10x + 120 − 4x = 180 → 6x = 60 → x = 10.", "c": "x"}]}, {"n": 2, "tema": "Tempo de tela e saúde mental dos adolescentes", "textos": [{"label": "Texto 1", "titulo": "Adolescentes passam mais de oito horas por dia diante de telas, aponta estudo", "autor": "Reportagem", "paras": ["Uma pesquisa feita com 3 mil estudantes de escolas públicas e privadas do Nordeste revelou que os adolescentes passam, em média, 8 horas e 20 minutos por dia diante de telas de celulares, tablets e computadores. O levantamento, divulgado nesta semana, foi conduzido por pesquisadores de uma universidade federal.", "Segundo o estudo, 45% dos entrevistados afirmaram dormir menos de seis horas por noite, e 38% disseram sentir ansiedade quando ficam sem o aparelho. Os pesquisadores observaram, ainda, que quem usa as redes sociais por mais de quatro horas diárias relata mais dificuldade de concentração nas aulas.", "“O problema não é a tecnologia em si, mas o uso excessivo e sem limites”, explica a psicóloga Helena Duarte, que coordenou a pesquisa. Ela lembra que a adolescência é uma fase de intensas mudanças, em que a comparação com os outros costuma causar sofrimento. Por isso, as imagens perfeitas que circulam nas redes podem alimentar a insegurança.", "Para os especialistas, a solução passa pelo diálogo. Pais e escolas devem estabelecer combinados, como horários sem celular, refeições em família e atividades ao ar livre. Algumas escolas já proíbem o uso do aparelho durante as aulas, e os professores relatam que os estudantes passaram a interagir mais nos intervalos.", "Os pesquisadores também recomendam que os jovens procurem ajuda quando perceberem que o uso das redes está prejudicando o sono, os estudos ou os relacionamentos. Os serviços de saúde das cidades oferecem acompanhamento psicológico gratuito."]}, {"label": "Texto 2", "titulo": "Tirinha (descrição da imagem)", "autor": "", "paras": ["<b>Quadro 1:</b> Um garoto de bermuda, na praia, diz a uma amiga: “Fui à praia hoje e não tirei nenhuma foto!”.", "<b>Quadro 2:</b> A amiga, surpresa, pergunta: “Sério? E como você vai provar que foi?”.", "<b>Quadro 3:</b> O garoto, pensativo, responde: “Eu... lembro?”.", "<b>Quadro 4:</b> A amiga, de olhos arregalados, comenta: “Pra mim, isso é viver só pra você mesmo!”."]}], "qs": [{"q": "Pelos dados do Texto 1, é possível inferir que", "pre": "", "o": ["o uso prolongado das telas pode estar associado a prejuízos no sono e na atenção dos adolescentes.", "o tempo de tela melhora o desempenho escolar dos estudantes.", "a ansiedade causada pela ausência do aparelho afeta apenas adultos.", "os pesquisadores defendem a proibição total da tecnologia."], "a": 0, "e": "Os dados mostram que 45% dormem menos de seis horas e que quem usa redes por mais de quatro horas tem mais dificuldade de concentração. A psicóloga afirma que o problema “não é a tecnologia em si”, o que descarta D.", "c": "I"}, {"q": "Quanto ao gênero textual, o Texto 1 configura-se como", "pre": "", "o": ["artigo de opinião.", "editorial.", "reportagem.", "crônica."], "a": 2, "e": "Texto informativo, com dados de pesquisa, citação de especialista e aprofundamento do assunto: reportagem. Artigo e editorial defendem pontos de vista; crônica é narrativa de fatos do cotidiano.", "c": "G"}, {"q": "No Texto 1, predomina a sequência textual", "pre": "", "o": ["narrativa, pois relata fatos em ordem cronológica.", "injuntiva, pois ordena ações ao leitor.", "expositiva, pois apresenta e explica dados e informações.", "descritiva, pois caracteriza detalhadamente uma pessoa."], "a": 2, "e": "O texto apresenta resultados, percentuais e explicações de especialistas, característicos da sequência expositiva (informativa).", "c": "G"}, {"q": "De acordo com a psicóloga Helena Duarte,", "pre": "", "o": ["a tecnologia deve ser abolida da vida dos jovens.", "o uso de redes sociais é sempre positivo.", "os adolescentes não sofrem influência das imagens das redes.", "o problema está no uso excessivo e sem limites, e não na tecnologia em si."], "a": 3, "e": "Informação literal do 3º parágrafo.", "c": "I"}, {"q": "No 3º parágrafo, as aspas são usadas para indicar", "pre": "", "o": ["ironia do repórter.", "uma palavra estrangeira.", "a fala literal (discurso direto) da especialista.", "uma gíria."], "a": 2, "e": "As aspas reproduzem exatamente as palavras da psicóloga, o que dá credibilidade à reportagem (citação de fonte especializada).", "c": "P"}, {"q": "Questões 6 a 9 – O QUE (1) é", "pre": "Os pesquisadores observaram, ainda, que (1) quem usa as redes sociais por mais de quatro horas diárias relata (2) mais dificuldade de concentração nas aulas.", "o": ["pronome relativo.", "conjunção integrante.", "pronome interrogativo.", "conjunção causal."], "a": 1, "e": "Ele introduz a oração que completa o verbo “observaram” (observaram algo). É conjunção subordinativa integrante.", "c": "S"}, {"q": "A oração iniciada pelo QUE (1) classifica-se como subordinada", "pre": "", "o": ["substantiva subjetiva.", "adjetiva restritiva.", "substantiva completiva nominal.", "substantiva objetiva direta."], "a": 3, "e": "Pergunta-se ao verbo: os pesquisadores observaram o quê? “Que quem usa as redes… relata…”. Responde ao verbo sem preposição: objetiva direta.", "c": "S"}, {"q": "Em relação ao verbo RELATA (2), o trecho “quem usa as redes sociais por mais de quatro horas diárias” exerce a função de", "pre": "", "o": ["objeto direto.", "adjunto adnominal.", "sujeito.", "agente da passiva."], "a": 2, "e": "Quem relata dificuldade de concentração? “Quem usa as redes sociais por mais de quatro horas diárias”. É o sujeito do verbo.", "c": "S"}, {"q": "As vírgulas que isolam a palavra AINDA no trecho indicam", "pre": "", "o": ["separação de termos de mesma função.", "isolamento de um vocativo.", "isolamento de um aposto.", "isolamento de uma palavra ou expressão intercalada na oração."], "a": 3, "e": "“Ainda” (= além disso) é uma palavra de acréscimo que aparece no meio da oração, e termos intercalados são separados por vírgulas.", "c": "P"}, {"q": "No 1º parágrafo, a palavra LEVANTAMENTO é sinônima, no contexto, de", "pre": "", "o": ["reclamação.", "proibição.", "pesquisa.", "reunião."], "a": 2, "e": "“O levantamento, divulgado nesta semana, foi conduzido por pesquisadores”: o termo equivale a pesquisa (coleta de dados).", "c": "M"}, {"q": "No 3º parágrafo, o termo ELA (“Ela lembra que a adolescência…”) retoma", "pre": "", "o": ["a pesquisa.", "a tecnologia.", "a adolescência.", "a psicóloga Helena Duarte."], "a": 3, "e": "A frase anterior termina com a psicóloga que coordenou a pesquisa. “Ela” (3ª pessoa do singular feminino) refere-se a ela.", "c": "C"}, {"q": "No 3º parágrafo, a expressão POR ISSO estabelece relação de", "pre": "", "o": ["oposição.", "conclusão.", "concessão.", "adição."], "a": 1, "e": "“Por isso” introduz a consequência do que foi dito antes (a comparação causa sofrimento → as imagens perfeitas podem alimentar a insegurança): conclusão/consequência.", "c": "C"}, {"q": "No trecho “não é a tecnologia em si, mas o uso excessivo”, a palavra MAS estabelece relação de", "pre": "", "o": ["oposição (retificação).", "causa.", "finalidade.", "explicação."], "a": 0, "e": "“Mas” é conjunção adversativa: corrige a ideia anterior e apresenta o ponto de vista contrário (o problema é o excesso, não a tecnologia).", "c": "C"}, {"q": "Têm acento gráfico pela mesma regra as palavras", "pre": "", "o": ["psicóloga e média.", "média e adolescência.", "psicóloga e adolescência.", "tecnologia e psicóloga."], "a": 1, "e": "Média e adolescência são paroxítonas terminadas em ditongo (-ia, -ncia). Psicóloga é proparoxítona. Tecnologia não tem acento.", "c": "A"}, {"q": "O vocábulo PESQUISADORES é formado por", "pre": "", "o": ["derivação prefixal.", "derivação parassintética.", "composição por justaposição.", "derivação sufixal."], "a": 3, "e": "Pesquisa + sufixo -dor (+ -es, plural). Só há acréscimo de sufixo.", "c": "F"}, {"q": "O propósito comunicativo prioritário do Texto 2 é", "pre": "", "o": ["criticar a necessidade de registrar e exibir nas redes tudo o que se vive.", "incentivar o uso de câmeras de celular.", "informar sobre os melhores destinos de praia.", "elogiar a memória dos jovens."], "a": 0, "e": "A tirinha ironiza quem só considera real uma experiência se ela for provada com fotos. A fala final da amiga reforça a crítica.", "c": "I"}, {"q": "A leitura do Texto 2 permite inferir que", "pre": "", "o": ["os jovens valorizam mais a experiência vivida do que o registro.", "viver uma experiência pode ficar em segundo plano diante da necessidade de mostrá-la nas redes.", "a praia é o único lugar em que não se usa o celular.", "a amiga considera as fotos desnecessárias."], "a": 1, "e": "O espanto da amiga mostra que, para ela, sem foto não há prova. A tirinha critica essa lógica. A) e D) são o oposto; C) não tem base no texto.", "c": "I"}, {"q": "Quanto ao gênero textual, os Textos 1 e 2 são, respectivamente,", "pre": "", "o": ["artigo de opinião e charge.", "reportagem e tirinha.", "notícia e cartum.", "editorial e cartaz."], "a": 1, "e": "O Texto 1 é uma reportagem. O Texto 2 tem quadros sequenciais, personagens e diálogos com humor: é tirinha (a charge é de um único quadro, com crítica a fato atual específico).", "c": "G"}, {"q": "No Texto 2, o uso da forma PRA (“Pra mim”) em lugar de “para” caracteriza", "pre": "", "o": ["linguagem formal.", "registro informal, com marcas de oralidade.", "variante histórica.", "erro de ortografia."], "a": 1, "e": "Em situações de fala espontânea, a redução “para” → “pra” é comum. A tirinha reproduz a oralidade, adequada ao gênero. Não é “erro”, e sim marca de registro informal.", "c": "L"}, {"q": "No Texto 2, as reticências em “Eu... lembro?” indicam", "pre": "", "o": ["hesitação, dúvida do personagem.", "ênfase em uma ordem.", "enumeração de itens.", "fim da narrativa."], "a": 0, "e": "As reticências sugerem pausa, hesitação: o garoto percebe que só tem a lembrança como prova.", "c": "P"}, {"q": "Um aplicativo tem 2.500.000 usuários. Esse número, em notação científica, é", "pre": "", "o": ["2,5 × 10<sup>6</sup>", "25 × 10<sup>5</sup>", "2,5 × 10<sup>5</sup>", "0,25 × 10<sup>7</sup>"], "a": 0, "e": "2.500.000 = 2,5 × 1.000.000 = 2,5 × 10<sup>6</sup>. O coeficiente deve estar entre 1 e 10.", "c": "n"}, {"q": "Segundo o Texto 1, o tempo médio diário de tela é de 8 h 20 min. Em 7 dias, o tempo total de tela é de", "pre": "", "o": ["56 h 20 min.", "58 h 40 min.", "58 h 20 min.", "60 h 20 min."], "a": 2, "e": "8 h × 7 = 56 h e 20 min × 7 = 140 min = 2 h 20 min. Total: 56 h + 2 h 20 min = 58 h 20 min.", "c": "q"}, {"q": "Segundo o Texto 1, 45% dos 3.000 estudantes entrevistados dormem menos de seis horas por noite. O número de estudantes nessa situação é", "pre": "", "o": ["1.200.", "1.450.", "1.500.", "1.350."], "a": 3, "e": "45% de 3.000 = 0,45 × 3.000 = 1.350.", "c": "p"}, {"q": "João passa o dobro de horas diárias de tela de Maria. Juntos, os dois passam 9 horas por dia. O tempo de João é de", "pre": "", "o": ["3 horas.", "6 horas.", "5 horas.", "4 horas."], "a": 1, "e": "Maria = x; João = 2x. x + 2x = 9 → x = 3. João = 2 × 3 = 6 horas.", "c": "x"}, {"q": "Um aplicativo consome 450 MB de dados em 3 dias de uso. Mantendo o mesmo consumo diário, em 7 dias consumirá", "pre": "", "o": ["900 MB.", "1.050 MB.", "1.350 MB.", "1.200 MB."], "a": 1, "e": "Regra de três direta: 450 → 3 dias; x → 7 dias. x = 450 × 7 ÷ 3 = 1.050 MB. (Consumo diário: 150 MB × 7 = 1.050.)", "c": "r"}, {"q": "O tempo de tela de uma aluna, em horas, nos seis dias da semana foi: 6, 8, 9, 5, 7 e 7. A média diária foi de", "pre": "", "o": ["6.", "9.", "8.", "7."], "a": 3, "e": "Soma = 6 + 8 + 9 + 5 + 7 + 7 = 42. Média = 42 ÷ 6 = 7 horas.", "c": "t"}, {"q": "Um fone foi comprado por R$ 600,00 a juros simples de 3% ao mês, durante 5 meses. O valor total dos juros é de", "pre": "", "o": ["R$ 90,00.", "R$ 108,00.", "R$ 150,00.", "R$ 690,00."], "a": 0, "e": "J = 600 × 0,03 × 5 = R$ 90,00. (R$ 690,00 é o montante.)", "c": "j"}, {"q": "Um plano de internet custa P(x) = 40 + 2x reais, em que x é o número de GB excedentes. Para 15 GB excedentes, o valor é de", "pre": "", "o": ["R$ 55,00.", "R$ 80,00.", "R$ 70,00.", "R$ 100,00."], "a": 2, "e": "P(15) = 40 + 2 × 15 = 40 + 30 = R$ 70,00.", "c": "f"}, {"q": "Em uma turma de 40 alunos, 3/8 usam o celular nos intervalos para jogar. O número de alunos que jogam é", "pre": "", "o": ["12.", "18.", "15.", "20."], "a": 2, "e": "3/8 de 40 = 3 × 40 ÷ 8 = 15.", "c": "q"}, {"q": "Em uma sala, a razão entre o número de meninas e o de meninos é 3 : 2. Se há 35 alunos no total, o número de meninas é", "pre": "", "o": ["21.", "15.", "14.", "20."], "a": 0, "e": "3k + 2k = 35 → k = 7. Meninas = 3 × 7 = 21 (e meninos = 14).", "c": "q"}, {"q": "Dois lembretes de pausa digital tocam, respectivamente, de 45 em 45 minutos e de 60 em 60 minutos. Se tocaram juntos às 14h, tocarão juntos novamente às", "pre": "", "o": ["15h.", "16h.", "18h.", "17h."], "a": 3, "e": "MMC(45, 60) = 180 minutos = 3 horas (45 = 3²·5; 60 = 2²·3·5 → 2²·3²·5 = 180). 14h + 3 h = 17h.", "c": "m"}, {"q": "Uma escola vai dividir 60 alunos do 9º A e 84 do 9º B em grupos com o mesmo número de alunos, o maior possível, sem misturar as turmas. Cada grupo terá", "pre": "", "o": ["6 alunos.", "12 alunos.", "14 alunos.", "24 alunos."], "a": 1, "e": "MDC(60, 84) = 12 (60 = 2²·3·5; 84 = 2²·3·7 → MDC = 2²·3 = 12).", "c": "m"}, {"q": "Uma sala de estudos retangular, sem celulares, mede 8 m por 5 m. Ela será coberta com peças de cerâmica quadradas de 0,5 m de lado. O número de peças necessário é", "pre": "", "o": ["80.", "120.", "160.", "200."], "a": 2, "e": "Área da sala = 8 × 5 = 40 m². Área de cada peça = 0,5 × 0,5 = 0,25 m². 40 ÷ 0,25 = 160 peças.", "c": "g"}, {"q": "Uma escada de 5 m está apoiada em uma parede, com a base a 3 m da parede. A altura atingida na parede é de", "pre": "", "o": ["4 m.", "3 m.", "5 m.", "8 m."], "a": 0, "e": "Triângulo retângulo com hipotenusa 5 e cateto 3: x² + 3² = 5² → x² = 16 → x = 4 m (terno pitagórico 3-4-5).", "c": "g"}, {"q": "Em um grupo de 30 alunos, 12 usam fones de ouvido na escola. Sorteando um aluno ao acaso, a probabilidade de ele usar fones é de", "pre": "", "o": ["12/18.", "3/5.", "1/2.", "2/5."], "a": 3, "e": "P = 12/30 = 2/5.", "c": "b"}, {"q": "O tempo diário de tela de um jovem passou de 5 h para 6 h 30 min. O aumento percentual foi de", "pre": "", "o": ["15%.", "30%.", "25%.", "20%."], "a": 1, "e": "Aumento = 1 h 30 min = 1,5 h. 1,5 ÷ 5 = 0,3 = 30%.", "c": "p"}, {"q": "Um reservatório cilíndrico tem 1 m de raio e 2 m de altura. Considerando π = 3,14, seu volume, em litros, é de", "pre": "", "o": ["628.", "6.280.", "12.560.", "3.140."], "a": 1, "e": "V = π · r² · h = 3,14 × 1² × 2 = 6,28 m³ = 6.280 litros.", "c": "e"}, {"q": "Em uma gincana sem celular, o ingresso de aluno custou R$ 5,00 e o de adulto, R$ 12,00. Foram vendidos 40 ingressos, somando R$ 270,00. O número de ingressos de aluno vendidos foi", "pre": "", "o": ["20.", "25.", "30.", "35."], "a": 2, "e": "Seja x o número de alunos: 5x + 12(40 − x) = 270 → 5x + 480 − 12x = 270 → −7x = −210 → x = 30.", "c": "x"}, {"q": "Uma senha de 3 dígitos distintos será formada com os algarismos 1, 2, 3, 4 e 5. O número de senhas possíveis é", "pre": "", "o": ["15.", "120.", "125.", "60."], "a": 3, "e": "Sem repetição: 5 × 4 × 3 = 60. (125 seria se os dígitos pudessem repetir: 5 × 5 × 5.)", "c": "b"}, {"q": "Em um mapa na escala 1 : 200.000, a distância entre duas cidades é de 3 cm. A distância real é de", "pre": "", "o": ["6 km.", "0,6 km.", "60 km.", "600 km."], "a": 0, "e": "3 × 200.000 = 600.000 cm = 6.000 m = 6 km.", "c": "q"}]}, {"n": 3, "tema": "Energias renováveis e desenvolvimento sustentável no Rio Grande do Norte", "textos": [{"label": "Texto 1", "titulo": "Vento e sol: o futuro do Rio Grande do Norte", "autor": "Editorial", "paras": ["O Rio Grande do Norte é, há alguns anos, o maior produtor de energia eólica do país. Os ventos constantes do litoral e do interior, que (1) antes eram vistos apenas como característica do clima, transformaram-se em riqueza. Além disso, a forte incidência de sol ao longo do ano coloca o estado em posição privilegiada também na produção de energia solar.", "Esse potencial, no entanto, precisa ser aproveitado com responsabilidade. Parques eólicos e usinas solares geram empregos e atraem investimentos, mas podem causar impactos quando instalados sem diálogo com as comunidades locais. Pescadores, agricultores e populações tradicionais têm o direito de ser ouvidos antes que qualquer obra comece.", "Outro desafio é garantir que os benefícios cheguem à população. De que adianta ser referência na geração de energia se muitas famílias ainda pagam contas altas e vivem com o fornecimento instável? Cabe ao poder público incentivar a energia solar em residências, escolas e hospitais, reduzindo gastos e levando sustentabilidade ao cotidiano.", "Por fim, é indispensável investir na formação de profissionais. Cursos técnicos, como os oferecidos pelo IFRN, preparam jovens para atuar na instalação e na manutenção dos equipamentos, o que pode transformar a vida de milhares de famílias.", "Portanto, o estado deve seguir na liderança das energias limpas, desde que o desenvolvimento seja justo, participativo e sustentável."]}, {"label": "Texto 2", "titulo": "Infográfico: como funciona a energia solar fotovoltaica", "autor": "", "paras": ["<b>1. Captação:</b> os painéis recebem a luz do sol e a transformam em corrente elétrica contínua.", "<b>2. Conversão:</b> o inversor converte a corrente contínua em corrente alternada, a que é usada nas casas.", "<b>3. Distribuição:</b> a energia passa pelo quadro elétrico e abastece os aparelhos.", "<b>4. Economia:</b> o excesso é enviado à rede da distribuidora e vira créditos na conta de luz."]}], "qs": [{"q": "A leitura do Texto 1 permite inferir que", "pre": "", "o": ["o Rio Grande do Norte deve abandonar a produção de energia eólica.", "o desenvolvimento energético só será positivo se respeitar as comunidades e beneficiar a população.", "as populações tradicionais são contrárias a qualquer obra de energia.", "o poder público não tem responsabilidade sobre o uso da energia solar."], "a": 1, "e": "O texto defende desenvolvimento “justo, participativo e sustentável” e destaca que as comunidades devem ser ouvidas e a população beneficiada. As demais afirmações não têm base no texto (ou o contradizem).", "c": "I"}, {"q": "Quanto ao gênero textual, o Texto 1 configura-se como", "pre": "", "o": ["reportagem.", "notícia.", "editorial.", "artigo científico."], "a": 2, "e": "Texto sem assinatura individual, que expressa o ponto de vista do veículo de comunicação sobre um assunto atual: editorial.", "c": "G"}, {"q": "Quanto à tipologia, o Texto 1 é predominantemente", "pre": "", "o": ["narrativo.", "descritivo.", "expositivo.", "argumentativo."], "a": 3, "e": "O texto defende uma tese (o estado deve liderar as energias limpas com justiça e participação) e a sustenta com argumentos e propostas: tipologia argumentativa.", "c": "G"}, {"q": "No 3º parágrafo, o autor", "pre": "", "o": ["alerta que ser referência em geração não garante benefícios diretos às famílias.", "elogia sem restrições a situação energética do estado.", "propõe a proibição da energia solar em residências.", "afirma que o fornecimento de energia no estado é estável."], "a": 0, "e": "A pergunta “De que adianta ser referência… se muitas famílias ainda pagam contas altas…?” expressa o alerta de que a produção por si só não resolve o problema da população.", "c": "I"}, {"q": "No 3º parágrafo, a pergunta “De que adianta ser referência na geração de energia…?” é uma pergunta retórica, pois", "pre": "", "o": ["exige uma resposta imediata do leitor.", "pede uma informação ao leitor.", "serve para convidar o leitor a refletir e reforça o argumento do autor.", "indica que o autor tem dúvida."], "a": 2, "e": "A pergunta retórica não busca resposta: é uma estratégia argumentativa que leva o leitor à conclusão desejada pelo autor.", "c": "I"}, {"q": "Questões 6 a 9 – No trecho “Os ventos constantes do litoral e do interior, que (1) antes eram vistos apenas como característica do clima, transformaram-se em riqueza”, o QUE (1) é", "pre": "", "o": ["pronome relativo.", "conjunção integrante.", "conjunção causal.", "pronome interrogativo."], "a": 0, "e": "Substitui “os ventos” e liga duas orações: pronome relativo (= os quais).", "c": "S"}, {"q": "A oração iniciada por “que antes eram vistos apenas como característica do clima” é subordinada", "pre": "", "o": ["adjetiva restritiva.", "adverbial causal.", "substantiva objetiva direta.", "adjetiva explicativa."], "a": 3, "e": "Está entre vírgulas e apenas acrescenta uma informação sobre os ventos (que já são conhecidos, “constantes”), sem restringi-los: adjetiva explicativa.", "c": "S"}, {"q": "A locução verbal “eram vistos” está na voz", "pre": "", "o": ["ativa.", "passiva analítica.", "passiva sintética.", "reflexiva."], "a": 1, "e": "Verbo auxiliar (ser) + particípio (visto): voz passiva analítica. O sujeito (os ventos) sofre a ação.", "c": "V"}, {"q": "No mesmo trecho, a palavra APENAS expressa ideia de", "pre": "", "o": ["inclusão.", "retificação.", "explicação.", "limitação (exclusão)."], "a": 3, "e": "“Apenas” restringe: antes os ventos eram vistos somente como característica do clima, nada além disso. É palavra denotativa de exclusão/limitação.", "c": "M"}, {"q": "No 2º parágrafo, a expressão NO ENTANTO estabelece relação de", "pre": "", "o": ["oposição.", "conclusão.", "adição.", "explicação."], "a": 0, "e": "“No entanto” equivale a “porém”: contrapõe a ideia de grande potencial à necessidade de responsabilidade. É conjunção adversativa.", "c": "C"}, {"q": "No 1º parágrafo, a expressão ALÉM DISSO introduz uma ideia de", "pre": "", "o": ["finalidade.", "oposição.", "adição.", "concessão."], "a": 2, "e": "“Além disso” acrescenta mais um argumento (o sol também coloca o estado em posição privilegiada).", "c": "C"}, {"q": "No 1º parágrafo, a palavra PRIVILEGIADA pode ser substituída, sem prejuízo de sentido, por", "pre": "", "o": ["prejudicada.", "favorecida.", "distante.", "limitada."], "a": 1, "e": "Posição privilegiada = vantajosa, favorecida.", "c": "M"}, {"q": "Um antônimo para INDISPENSÁVEL (4º parágrafo) é", "pre": "", "o": ["essencial.", "necessário.", "fundamental.", "dispensável."], "a": 3, "e": "Indispensável = que não se pode dispensar. Antônimo: dispensável. As outras três são sinônimos.", "c": "M"}, {"q": "No 2º parágrafo, a expressão ESSE POTENCIAL retoma", "pre": "", "o": ["a capacidade do estado de produzir energia eólica e solar.", "os impactos causados nas comunidades.", "os empregos gerados pelas usinas.", "o direito de ser ouvido."], "a": 0, "e": "O pronome demonstrativo “esse” retoma o que foi apresentado no 1º parágrafo: a capacidade de gerar energia dos ventos e do sol.", "c": "C"}, {"q": "O acento gráfico em TÊM (“Pescadores, agricultores e populações tradicionais têm o direito”) justifica-se para", "pre": "", "o": ["indicar a 3ª pessoa do singular.", "marcar uma palavra proparoxítona.", "diferenciar a 3ª pessoa do plural da 3ª pessoa do singular (tem).", "indicar crase."], "a": 2, "e": "Acento diferencial: tem (singular) × têm (plural). O sujeito “pescadores, agricultores e populações” está no plural.", "c": "A"}, {"q": "O vocábulo FOTOVOLTAICA (Texto 2) é formado por", "pre": "", "o": ["derivação prefixal.", "composição por justaposição.", "composição por aglutinação.", "derivação sufixal."], "a": 1, "e": "Foto (luz) + voltaica: dois radicais unidos sem perda de fonemas, o que caracteriza composição por justaposição.", "c": "F"}, {"q": "O propósito comunicativo prioritário do Texto 2 é", "pre": "", "o": ["explicar, passo a passo, o funcionamento da energia solar fotovoltaica.", "criticar o alto custo da energia solar.", "convencer o leitor a abandonar a energia eólica.", "narrar a história de uma usina solar."], "a": 0, "e": "O infográfico é um gênero informativo/explicativo: organiza em etapas numeradas o processo de produção e uso da energia solar.", "c": "I"}, {"q": "No Texto 2, predominam", "pre": "", "o": ["linguagem poética e verbos no pretérito.", "linguagem opinativa, com marcas de subjetividade.", "gírias e marcas de oralidade.", "linguagem formal, denotativa e verbos no presente do indicativo."], "a": 3, "e": "Verbos como “recebem”, “converte”, “passa”, “é enviado” (presente) e linguagem objetiva (sentido literal) caracterizam textos explicativos.", "c": "L"}, {"q": "A relação entre os Textos 1 e 2 é a de que", "pre": "", "o": ["o Texto 2 contradiz o Texto 1.", "ambos criticam o uso de energia eólica.", "o Texto 2 detalha tecnicamente a energia solar mencionada no Texto 1.", "ambos são narrativos."], "a": 2, "e": "O Texto 1 defende o incentivo à energia solar; o Texto 2 explica como ela funciona. Os textos se complementam.", "c": "I"}, {"q": "Quanto ao gênero textual, os Textos 1 e 2 são, respectivamente,", "pre": "", "o": ["reportagem e charge.", "editorial e infográfico.", "artigo de opinião e cartaz.", "notícia e tirinha."], "a": 1, "e": "Texto 1: editorial (opinião do veículo). Texto 2: infográfico (texto verbal e visual que explica um processo).", "c": "G"}, {"q": "O consumo de energia de um parque industrial foi de 120.000.000 kWh em um ano. Em notação científica, esse valor é", "pre": "", "o": ["12 × 10<sup>7</sup>", "1,2 × 10<sup>7</sup>", "1,2 × 10<sup>8</sup>", "0,12 × 10<sup>9</sup>"], "a": 2, "e": "120.000.000 = 1,2 × 100.000.000 = 1,2 × 10<sup>8</sup>. O coeficiente deve estar entre 1 e 10 (por isso 12 e 0,12 não servem).", "c": "n"}, {"q": "Uma conta de luz de R$ 400,00 teve redução de 85% após a instalação de painéis solares. O novo valor da conta é de", "pre": "", "o": ["R$ 60,00.", "R$ 85,00.", "R$ 340,00.", "R$ 15,00."], "a": 0, "e": "Redução = 85% de 400 = R$ 340,00. Nova conta = 400 − 340 = R$ 60,00 (ou 15% de 400).", "c": "p"}, {"q": "Um sistema solar de R$ 18.000,00 foi financiado a juros simples de 1,5% ao mês, por 10 meses. O valor dos juros é de", "pre": "", "o": ["R$ 270,00.", "R$ 20.700,00.", "R$ 2.970,00.", "R$ 2.700,00."], "a": 3, "e": "J = 18.000 × 0,015 × 10 = R$ 2.700,00. (20.700 é o montante.)", "c": "j"}, {"q": "Um painel solar gera 1,2 kWh em 4 horas de sol. Mantido o ritmo, em 10 horas ele gerará", "pre": "", "o": ["2,4 kWh.", "3 kWh.", "4,8 kWh.", "12 kWh."], "a": 1, "e": "Regra de três direta: 1,2 ÷ 4 = 0,3 kWh por hora. Em 10 horas: 0,3 × 10 = 3 kWh.", "c": "r"}, {"q": "O custo mensal de manutenção de painéis é C(x) = 1.200 + 350x, em reais, sendo x o número de painéis. Para 20 painéis, o custo é de", "pre": "", "o": ["R$ 7.000,00.", "R$ 8.200,00.", "R$ 8.500,00.", "R$ 1.550,00."], "a": 1, "e": "C(20) = 1.200 + 350 × 20 = 1.200 + 7.000 = R$ 8.200,00.", "c": "f"}, {"q": "Duas turbinas são revisadas a cada 15 e a cada 20 dias, respectivamente. Se foram revisadas juntas hoje, voltarão a ser revisadas juntas daqui a", "pre": "", "o": ["60 dias.", "45 dias.", "30 dias.", "300 dias."], "a": 0, "e": "MMC(15, 20): 15 = 3·5; 20 = 2²·5 → 2²·3·5 = 60 dias.", "c": "m"}, {"q": "Um terreno retangular de 40 m por 25 m terá 60% de sua área ocupada por painéis solares de 2 m² cada. O número de painéis é", "pre": "", "o": ["600.", "500.", "300.", "250."], "a": 2, "e": "Área = 40 × 25 = 1.000 m². 60% = 600 m². 600 ÷ 2 = 300 painéis.", "c": "g"}, {"q": "Um cabo de sustentação de uma torre está fixado a 12 m de altura e a 9 m da base da torre, formando um triângulo retângulo. O comprimento do cabo é de", "pre": "", "o": ["13 m.", "21 m.", "18 m.", "15 m."], "a": 3, "e": "c² = 12² + 9² = 144 + 81 = 225 → c = 15 m (terno 3-4-5 multiplicado por 3).", "c": "g"}, {"q": "Um reservatório para limpeza de painéis tem formato de cubo com 1,5 m de aresta. Sua capacidade, em litros, é de", "pre": "", "o": ["3.375.", "2.250.", "337,5.", "4.500."], "a": 0, "e": "V = 1,5³ = 3,375 m³ = 3.375 litros (1 m³ = 1.000 L).", "c": "e"}, {"q": "Uma escola economizou 2/5 de uma conta de energia de R$ 3.500,00 após instalar energia solar. O valor economizado foi de", "pre": "", "o": ["R$ 1.050,00.", "R$ 2.100,00.", "R$ 1.750,00.", "R$ 1.400,00."], "a": 3, "e": "2/5 de 3.500 = 2 × 3.500 ÷ 5 = 7.000 ÷ 5 = R$ 1.400,00.", "c": "q"}, {"q": "A produção mensal de um parque, em MWh, nos quatro primeiros meses do ano foi: 40, 52, 48 e 60. A média mensal foi de", "pre": "", "o": ["48.", "50.", "52.", "55."], "a": 1, "e": "Soma = 40 + 52 + 48 + 60 = 200. Média = 200 ÷ 4 = 50 MWh.", "c": "t"}, {"q": "A soma das potências de dois aerogeradores é 7 MW, e um deles tem 1 MW a mais que o outro. A potência do maior é", "pre": "", "o": ["3 MW.", "3,5 MW.", "4 MW.", "5 MW."], "a": 2, "e": "x + (x + 1) = 7 → 2x = 6 → x = 3. O maior tem 3 + 1 = 4 MW.", "c": "x"}, {"q": "Uma maquete de torre foi feita na escala 1 : 100. Se a altura da torre na maquete é de 80 cm, a altura real é de", "pre": "", "o": ["0,8 m.", "8 m.", "800 m.", "80 m."], "a": 3, "e": "80 × 100 = 8.000 cm = 80 m.", "c": "q"}, {"q": "Um painel de R$ 1.000,00 recebeu um desconto de 10% e, depois, mais 10% sobre o novo preço. O preço final foi de", "pre": "", "o": ["R$ 810,00.", "R$ 800,00.", "R$ 900,00.", "R$ 820,00."], "a": 0, "e": "1.000 − 10% = 900. Depois, 900 − 10% = 810. Os descontos sucessivos não somam 20% (que daria R$ 800,00).", "c": "p"}, {"q": "Um mês tem 30 dias, dos quais 18 foram ensolarados. Sorteando um dia ao acaso, a probabilidade de ter sido ensolarado é de", "pre": "", "o": ["2/5.", "1/2.", "18/12.", "3/5."], "a": 3, "e": "P = 18/30 = 3/5.", "c": "b"}, {"q": "Uma empresa dispõe de 3 modelos de painéis e 2 modelos de inversores. O número de combinações possíveis de um painel com um inversor é", "pre": "", "o": ["5.", "8.", "6.", "9."], "a": 2, "e": "Princípio multiplicativo: 3 × 2 = 6.", "c": "b"}, {"q": "A pá de um aerogerador tem 40 m de comprimento e gira em torno de um eixo, descrevendo um círculo de raio 40 m. Com π = 3,14, a área do círculo varrido é de", "pre": "", "o": ["1.256 m².", "5.024 m².", "2.512 m².", "10.048 m²."], "a": 1, "e": "A = π r² = 3,14 × 40² = 3,14 × 1.600 = 5.024 m².", "c": "g"}, {"q": "Um parque tem 14 aerogeradores de dois modelos: o modelo A produz 2 MW e o modelo B, 3 MW. A produção total é de 34 MW. O número de aerogeradores do modelo B é", "pre": "", "o": ["4.", "8.", "6.", "10."], "a": 2, "e": "Seja x o número do modelo A: 2x + 3(14 − x) = 34 → 42 − x = 34 → x = 8. Então B = 14 − 8 = 6. (Conferindo: 8×2 + 6×3 = 16 + 18 = 34.)", "c": "x"}, {"q": "As potências instaladas (em MW) de cinco usinas são: 12, 8, 20, 15 e 10. A mediana desses valores é", "pre": "", "o": ["10.", "12.", "13,0.", "15."], "a": 1, "e": "Ordenando: 8, 10, 12, 15, 20. O valor central (3º) é 12.", "c": "t"}, {"q": "No mesmo instante, um poste projeta uma sombra de 6 m e uma vara de 2 m projeta uma sombra de 1,5 m. A altura do poste é de", "pre": "", "o": ["8 m.", "7 m.", "6 m.", "9 m."], "a": 0, "e": "Triângulos semelhantes: H/6 = 2/1,5 → H = 12 ÷ 1,5 = 8 m.", "c": "g"}]}, {"n": 4, "tema": "Mobilidade urbana, bicicletas e transporte coletivo", "textos": [{"label": "Texto 1", "titulo": "Cidades apostam em ciclovias e transporte coletivo para destravar o trânsito", "autor": "Reportagem", "paras": ["Em muitas cidades brasileiras, o trânsito se tornou sinônimo de estresse e de atraso. Segundo levantamento de uma entidade de mobilidade urbana, o trabalhador de uma grande capital gasta, em média, 2 horas por dia no deslocamento entre casa e trabalho. Isso significa mais de 500 horas por ano dentro de ônibus, carros e metrôs.", "Para enfrentar o problema, algumas prefeituras vêm ampliando as ciclovias e investindo em corredores exclusivos de ônibus. Em uma capital do Nordeste, por exemplo, a rede cicloviária cresceu 35% em três anos, e o número de ciclistas diários dobrou.", "Os benefícios vão além da rapidez. Meios de transporte coletivos e não motorizados emitem menos poluentes, reduzem o ruído e deixam as ruas mais seguras. Além disso, quem pedala ou caminha pratica atividade física, o que (1) ajuda a prevenir doenças como diabetes e hipertensão.", "Apesar dos avanços, ainda há obstáculos. Muitas ciclovias não se conectam entre si, e a falta de iluminação causa insegurança, sobretudo à noite. Já o transporte coletivo enfrenta críticas pela lotação e pelos atrasos. Especialistas defendem que as cidades planejem a mobilidade de forma integrada, pensando primeiro nas pessoas e não nos carros.", "A estudante Camila Lima, de 17 anos, trocou o carro da família pela bicicleta para ir à escola. “Chego mais rápido e mais disposta”, afirma."]}, {"label": "Texto 2", "titulo": "Cartaz de campanha: “Cidade em Movimento” (descrição da imagem)", "autor": "", "paras": ["<b>Imagem:</b> de um lado, uma longa fila de 40 carros, cada um com apenas uma pessoa; do lado, um único ônibus, cheio de passageiros, ocupando o mesmo comprimento de rua.", "<b>Texto verbal:</b> “40 carros ocupam o mesmo espaço que 1 ônibus. Vamos dividir a rua?”.", "<b>Rodapé:</b> “Escolha o transporte coletivo. A cidade agradece.”"]}], "qs": [{"q": "A leitura do Texto 1 permite inferir que", "pre": "", "o": ["o planejamento integrado da mobilidade pode melhorar a qualidade de vida e a saúde da população.", "o transporte por carro é a única solução para o trânsito.", "as ciclovias já resolveram todos os problemas de mobilidade no Brasil.", "o transporte coletivo não enfrenta nenhuma crítica."], "a": 0, "e": "O texto relaciona a mobilidade integrada a ruas mais seguras, menos poluição e prevenção de doenças. As outras alternativas contradizem o 4º parágrafo (“ainda há obstáculos”, “críticas pela lotação”).", "c": "I"}, {"q": "Quanto ao gênero textual, o Texto 1 é", "pre": "", "o": ["artigo de opinião.", "reportagem.", "editorial.", "carta do leitor."], "a": 1, "e": "Texto informativo, com dados de pesquisa, exemplos, depoimento (Camila) e fala de especialistas: reportagem.", "c": "G"}, {"q": "O 4º parágrafo do Texto 1 trata principalmente", "pre": "", "o": ["dos benefícios ambientais das ciclovias.", "do aumento do número de ciclistas.", "da história do transporte coletivo.", "dos obstáculos que ainda persistem na mobilidade urbana."], "a": 3, "e": "O parágrafo começa com “Apesar dos avanços, ainda há obstáculos” e enumera: ciclovias desconectadas, falta de iluminação, lotação e atrasos.", "c": "I"}, {"q": "De acordo com o Texto 1,", "pre": "", "o": ["o número de ciclistas diminuiu nas capitais.", "o trabalhador gasta, em média, 5 horas por dia no trajeto.", "a rede cicloviária de uma capital do Nordeste cresceu 35% em três anos.", "os corredores de ônibus aumentam a poluição."], "a": 2, "e": "Informação literal do 2º parágrafo. O tempo médio citado é de 2 horas por dia.", "c": "I"}, {"q": "No último parágrafo, a fala de Camila Lima aparece entre aspas para", "pre": "", "o": ["indicar ironia da jornalista.", "indicar um título.", "destacar uma palavra estrangeira.", "reproduzir o depoimento da estudante, que serve de exemplo concreto ao assunto."], "a": 3, "e": "As aspas marcam o discurso direto, a fala literal da personagem. O depoimento ilustra o tema e aproxima o leitor da realidade.", "c": "P"}, {"q": "Questões 6 a 9 – No trecho “quem pedala ou caminha pratica atividade física, o que (1) ajuda a prevenir doenças como diabetes e hipertensão”, a expressão O QUE (1) é", "pre": "", "o": ["uma conjunção integrante.", "um pronome relativo que retoma toda a oração anterior.", "um pronome interrogativo.", "uma conjunção causal."], "a": 1, "e": "“O que” equivale a “fato que / coisa que” e retoma a ideia inteira de “praticar atividade física”. É pronome relativo.", "c": "S"}, {"q": "A oração “o que ajuda a prevenir doenças como diabetes e hipertensão” é subordinada", "pre": "", "o": ["substantiva subjetiva.", "adverbial final.", "adjetiva explicativa.", "adjetiva restritiva."], "a": 2, "e": "Está separada por vírgula e acrescenta uma informação (comentário) sobre a oração anterior, sem restringir nenhum termo: adjetiva explicativa.", "c": "S"}, {"q": "A expressão ALÉM DISSO (início do período) tem valor de", "pre": "", "o": ["adição.", "oposição.", "conclusão.", "concessão."], "a": 0, "e": "Soma mais um benefício ao que foi dito antes: adição.", "c": "C"}, {"q": "A palavra COMO, em “doenças como diabetes e hipertensão”, introduz", "pre": "", "o": ["uma condição.", "uma causa.", "uma comparação.", "uma exemplificação."], "a": 3, "e": "“Como” introduz exemplos de doenças (diabetes e hipertensão). Não compara nem indica causa.", "c": "C"}, {"q": "Um antônimo para RAPIDEZ (3º parágrafo) é", "pre": "", "o": ["agilidade.", "pressa.", "lentidão.", "velocidade."], "a": 2, "e": "Rapidez = velocidade. O contrário é lentidão. Agilidade, pressa e velocidade são sinônimos ou palavras próximas.", "c": "M"}, {"q": "No 4º parágrafo, a palavra OBSTÁCULOS pode ser substituída, sem prejuízo de sentido, por", "pre": "", "o": ["benefícios.", "empecilhos.", "avanços.", "soluções."], "a": 1, "e": "Obstáculo = empecilho, dificuldade.", "c": "M"}, {"q": "No 1º parágrafo, o pronome ISSO (“Isso significa mais de 500 horas por ano”) retoma", "pre": "", "o": ["o fato de o trabalhador gastar, em média, 2 horas por dia no deslocamento.", "o trânsito das cidades pequenas.", "o aumento das ciclovias.", "o número de carros nas ruas."], "a": 0, "e": "Isso resume a informação anterior (2 horas diárias). A conta confirma: 2 h × cerca de 250 dias úteis = 500 horas.", "c": "C"}, {"q": "A expressão APESAR DOS AVANÇOS (4º parágrafo) estabelece relação de", "pre": "", "o": ["finalidade.", "causa.", "concessão.", "explicação."], "a": 2, "e": "Admite um fato (houve avanços) que não impede o que vem depois (ainda há obstáculos). Relação de concessão.", "c": "C"}, {"q": "No trecho “Já o transporte coletivo enfrenta críticas”, o termo JÁ tem valor de", "pre": "", "o": ["tempo (anterioridade).", "finalidade.", "explicação.", "contraste (oposição)."], "a": 3, "e": "Aqui “já” não indica tempo: marca contraste com a frase anterior (ciclovias × transporte coletivo), com valor semelhante a “por outro lado”.", "c": "C"}, {"q": "Têm acento gráfico pela mesma regra as palavras", "pre": "", "o": ["metrôs e ônibus.", "ônibus e rápido.", "metrôs e rápido.", "carros e ônibus."], "a": 1, "e": "Ônibus e rápido são proparoxítonas (todas levam acento). Metrôs é oxítona terminada em -o seguida de s; carros não tem acento.", "c": "A"}, {"q": "No trecho “Muitas ciclovias não se conectam entre si”, o pronome SE tem valor de", "pre": "", "o": ["partícula apassivadora.", "índice de indeterminação do sujeito.", "conjunção.", "pronome recíproco."], "a": 3, "e": "As ciclovias “não se conectam entre si” = uma não se liga à outra. A expressão “entre si” reforça a ideia de reciprocidade.", "c": "S"}, {"q": "O propósito comunicativo prioritário do Texto 2 é", "pre": "", "o": ["convencer a população a usar o transporte coletivo.", "criticar apenas os motoristas de ônibus.", "informar sobre a história do ônibus.", "narrar um engarrafamento."], "a": 0, "e": "Cartaz de campanha: busca persuadir, com argumento visual (40 carros × 1 ônibus) e frase de apelo.", "c": "I"}, {"q": "A frase “Vamos dividir a rua?” apresenta, predominantemente, a função da linguagem", "pre": "", "o": ["referencial.", "poética.", "apelativa (conativa).", "emotiva."], "a": 2, "e": "Há um convite direto ao interlocutor (verbo no imperativo/pergunta de chamamento): função apelativa, típica de textos publicitários.", "c": "L"}, {"q": "A relação entre os Textos 1 e 2 é a de que", "pre": "", "o": ["o Texto 2 critica as ciclovias.", "ambos defendem o uso de meios de transporte coletivos ou sustentáveis.", "o Texto 1 defende o uso exclusivo do carro.", "ambos narram a vida de uma estudante."], "a": 1, "e": "O Texto 1 informa sobre os benefícios do transporte coletivo e não motorizado; o Texto 2 convoca a população a escolher o transporte coletivo.", "c": "I"}, {"q": "Quanto ao gênero textual, os Textos 1 e 2 são, respectivamente,", "pre": "", "o": ["reportagem e cartaz de campanha.", "editorial e charge.", "notícia e tirinha.", "artigo de opinião e infográfico."], "a": 0, "e": "Texto 1: reportagem. Texto 2: cartaz de campanha (propaganda de interesse público), com imagem e slogan persuasivo.", "c": "G"}, {"q": "A frota de veículos de uma cidade é de 1.250.000. Em notação científica, esse valor é", "pre": "", "o": ["12,5 × 10<sup>5</sup>", "1,25 × 10<sup>5</sup>", "1,25 × 10<sup>6</sup>", "0,125 × 10<sup>7</sup>"], "a": 2, "e": "1.250.000 = 1,25 × 1.000.000 = 1,25 × 10<sup>6</sup>.", "c": "n"}, {"q": "Uma rede cicloviária de 80 km cresceu 35%. O novo comprimento da rede é de", "pre": "", "o": ["108 km.", "28 km.", "115 km.", "98 km."], "a": 0, "e": "35% de 80 = 28 km. Novo comprimento = 80 + 28 = 108 km (ou 80 × 1,35).", "c": "p"}, {"q": "Um ciclista percorre 12 km em 45 minutos. Sua velocidade média, em km/h, é de", "pre": "", "o": ["12.", "15.", "18.", "16."], "a": 3, "e": "45 min = 0,75 h. v = distância ÷ tempo = 12 ÷ 0,75 = 16 km/h.", "c": "q"}, {"q": "Um ônibus, a 40 km/h, faz um trajeto em 30 minutos. A 60 km/h, o mesmo trajeto será feito em", "pre": "", "o": ["15 minutos.", "20 minutos.", "45 minutos.", "60 minutos."], "a": 1, "e": "Velocidade e tempo são inversamente proporcionais: 40 × 30 = 60 × t → t = 1.200 ÷ 60 = 20 minutos.", "c": "r"}, {"q": "Uma bicicleta de R$ 1.200,00 foi parcelada a juros simples de 2% ao mês, durante 6 meses. O valor dos juros é de", "pre": "", "o": ["R$ 120,00.", "R$ 1.344,00.", "R$ 144,00.", "R$ 24,00."], "a": 2, "e": "J = 1.200 × 0,02 × 6 = R$ 144,00. (R$ 1.344,00 é o montante.)", "c": "j"}, {"q": "Uma corrida de táxi custa C(x) = 6 + 2,5x reais, em que x é o número de quilômetros rodados. Para 14 km, o valor é de", "pre": "", "o": ["R$ 35,00.", "R$ 20,50.", "R$ 47,00.", "R$ 41,00."], "a": 3, "e": "C(14) = 6 + 2,5 × 14 = 6 + 35 = R$ 41,00.", "c": "f"}, {"q": "Duas linhas de ônibus saem do terminal a cada 12 minutos e a cada 20 minutos, respectivamente. Se saíram juntas às 6h, voltarão a sair juntas às", "pre": "", "o": ["6h30.", "7h.", "7h20.", "8h."], "a": 1, "e": "MMC(12, 20) = 60 minutos (12 = 2²·3; 20 = 2²·5 → 2²·3·5 = 60). 6h + 60 min = 7h.", "c": "m"}, {"q": "Dois trechos de ciclovia medem 84 m e 126 m. Eles serão divididos em pedaços de mesmo comprimento, o maior possível, sem sobras. Cada pedaço medirá", "pre": "", "o": ["42 m.", "21 m.", "14 m.", "84 m."], "a": 0, "e": "MDC(84, 126) = 42 (84 = 2²·3·7; 126 = 2·3²·7 → 2·3·7 = 42).", "c": "m"}, {"q": "Uma ciclovia contorna uma praça retangular de 30 m por 20 m. O comprimento da ciclovia é de", "pre": "", "o": ["50 m.", "100 m.", "600 m.", "120 m."], "a": 1, "e": "Perímetro = 2 × (30 + 20) = 100 m. (600 m² seria a área.)", "c": "g"}, {"q": "Uma rampa de acesso tem desnível (altura) de 1,5 m e afastamento horizontal de 2 m. O comprimento da rampa é de", "pre": "", "o": ["2,0 m.", "3,5 m.", "2,5 m.", "4,0 m."], "a": 2, "e": "c² = 1,5² + 2² = 2,25 + 4 = 6,25 → c = 2,5 m.", "c": "g"}, {"q": "Três ruas paralelas são cortadas por duas avenidas transversais. Na primeira avenida, os segmentos medem 6 m e 9 m; na segunda, medem 8 m e x. O valor de x é", "pre": "", "o": ["10 m.", "11 m.", "14 m.", "12 m."], "a": 3, "e": "Teorema de Tales: 6/9 = 8/x → 6x = 72 → x = 12 m.", "c": "g"}, {"q": "Em um estacionamento há 50 veículos, entre carros (4 rodas) e bicicletas (2 rodas), totalizando 140 rodas. O número de carros é", "pre": "", "o": ["15.", "25.", "20.", "30."], "a": 2, "e": "c + b = 50 e 4c + 2b = 140. Substituindo b = 50 − c: 4c + 100 − 2c = 140 → 2c = 40 → c = 20 (e b = 30).", "c": "x"}, {"q": "O tempo de deslocamento (em minutos) de cinco alunos até a escola foi: 35, 50, 45, 30 e 40. A média foi de", "pre": "", "o": ["38.", "40.", "42.", "45."], "a": 1, "e": "Soma = 35 + 50 + 45 + 30 + 40 = 200. Média = 200 ÷ 5 = 40 minutos.", "c": "t"}, {"q": "Em uma escola com 600 alunos, 1/4 vai de bicicleta e 1/3 vai de ônibus. O número de alunos que usam outros meios de transporte é", "pre": "", "o": ["250.", "200.", "150.", "350."], "a": 0, "e": "1/4 de 600 = 150; 1/3 de 600 = 200. Juntos: 350. Outros meios: 600 − 350 = 250.", "c": "q"}, {"q": "Em um sorteio de uma bicicleta participam 200 pessoas, e cada bilhete dá uma chance. Ana comprou 4 bilhetes. A probabilidade de Ana ganhar é de", "pre": "", "o": ["1/200.", "4/5.", "1/4.", "1/50."], "a": 3, "e": "P = 4/200 = 1/50.", "c": "b"}, {"q": "Maria tem 5 caminhos para ir de casa ao terminal e 3 caminhos para ir do terminal à escola. O número de maneiras diferentes de fazer o trajeto casa → terminal → escola é", "pre": "", "o": ["8.", "30.", "15.", "53."], "a": 2, "e": "Princípio multiplicativo: 5 × 3 = 15.", "c": "b"}, {"q": "Um contêiner para bicicletas tem formato de paralelepípedo com 6 m de comprimento, 2,4 m de largura e 2,5 m de altura. Seu volume é de", "pre": "", "o": ["14,4 m³.", "36 m³.", "30 m³.", "40 m³."], "a": 1, "e": "V = 6 × 2,4 × 2,5 = 14,4 × 2,5 = 36 m³.", "c": "e"}, {"q": "Um terreno trapezoidal para um bicicletário tem bases de 20 m e 12 m e altura de 8 m. Sua área é de", "pre": "", "o": ["128 m².", "96 m².", "160 m².", "256 m²."], "a": 0, "e": "A = (B + b) · h ÷ 2 = (20 + 12) × 8 ÷ 2 = 32 × 4 = 128 m².", "c": "g"}, {"q": "O preço de uma passagem de R$ 5,00 sofreu aumento de 8%. O novo preço é de", "pre": "", "o": ["R$ 5,08.", "R$ 5,80.", "R$ 5,40.", "R$ 8,00."], "a": 2,  if(!conv){const o=Object.entries(players).filter(([i])=>i!==uid).sort((a,b)=>online(b[1])-online(a[1]));
  $("#v").innerHTML=`<div class="card"><h2>💬 Conversas</h2><div class="row" data-a="oc" data-v="all" style="cursor:pointer"><span class="av">👥</span><div class="grow nm">Geral (todos)</div></div>${o.map(([i,p])=>`<div class="row" data-a="oc" data-v="${i}" style="cursor:pointer"><span class="av">${p.av}</span><div class="grow"><div class="nm">${esc(p.name)} · ${p.uf}</div><div class="mu">${dot(p)}${esc(stat(p).t)}</div></div></div>`).join("")||'<div class="mu">Convide os amigos pelo link!</div>'}</div>`;
  ACT.oc=v=>{conv=v;unsub&&unsub();msgs=[];unsub=db.collection(path()).orderBy("ts","desc").limit(80).onSnapshot(s=>{msgs=s.docs.map(d=>d.data()).reverse();paint()},e=>console.error(e));rChat()};return}
 $("#v").innerHTML=`<div class="card"><div style="display:flex;gap:8px;align-items:center;margin-bottom:6px"><button class="btn s g" data-a="cb">◀</button><div id="ch">${conv==="all"?"👥 <b>Geral</b>":""}</div></div><div class="msgs" id="ms"></div><div style="display:flex;gap:8px"><input id="tx" maxlength="400" placeholder="Mensagem…"><button class="btn" data-a="sd">➤</button></div></div>`;head();paint();
 ACT.cb=()=>{unsub&&unsub();conv=null;rChat()};
 ACT.sd=async()=>{const t=$("#tx").value.trim();if(!t)return;$("#tx").value="";try{await db.collection(path()).add({from:uid,text:t,ts:Date.now()})}catch(e){toast("Falha ao enviar")}};$("#tx").onkeydown=e=>{if(e.key==="Enter")ACT.sd()}}
/* ---------- MAIS: ranking, erros, glossário ---------- */
let gq="",gc="Todos";
function rMais(){
 $("#v").innerHTML=`<div class="seg">${[["rank","🏆 Ranking"],["perfil","📊 Perfil"],["err","🎯 Erros"],["corte","🏁 Corte"],["hist","🏛️ História"],["gl","📖 Glossário"]].map(([k,t])=>`<button data-a="ms" data-v="${k}" class="${msub===k?"on":""}">${t}</button>`).join("")}</div><div id="mb"></div>`;
 ACT.ms=v=>{msub=v;rMais()};const mb=$("#mb");
 if(msub==="rank")return rRank(mb);if(msub==="perfil")return rPerfil(mb);if(msub==="corte")return rCorte(mb);if(msub==="hist")return rHist(mb);
 if(msub==="err"){const e=Object.entries(me.err||{}).sort((a,b)=>b[1][0]-a[1][0]),w=weak();
  mb.innerHTML=`${w.map(([c,x])=>`<div class="alert">⚠️ Ei, você precisa revisar <b>${AS[c]}</b>! Errou ${x[0]} de ${x[1]}. <button class="btn s" data-a="trein" data-v="${c}">Treinar</button></div>`).join("")}<div class="card"><h2>Contador de erros por assunto</h2>${e.length?e.map(([c,x])=>`<div class="row"><div class="grow"><div>${AS[c]}</div><div class="bar e"><i style="width:${100*x[0]/x[1]}%"></i></div></div><div class="mu" style="width:70px;text-align:right">${x[0]} de ${x[1]}</div></div>`).join(""):'<div class="mu">Faça um simulado ou o quiz e o app começa a mapear seus pontos fracos.</div>'}</div>`;
  ACT.trein=v=>{tab="quiz";qStart(v);document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.k==="quiz"))};return}
 const cats=["Todos",...new Set(GL.map(g=>g[0]))],f=GL.filter(g=>(gc==="Todos"||g[0]===gc)&&(g[1]+g[2]+g[3]).toLowerCase().includes(gq.toLowerCase()));
 mb.innerHTML=`<input id="gs" placeholder="🔍 Buscar (metáfora, crase, oração…)" value="${esc(gq)}"><div>${cats.map(c=>`<button class="chip ${c===gc?"on":""}" data-a="gc" data-v="${c}">${c}</button>`).join("")}</div><div id="gl"></div>`;
 const pg=()=>{const f=GL.filter(g=>(gc==="Todos"||g[0]===gc)&&(g[1]+g[2]+g[3]).toLowerCase().includes(gq.toLowerCase()));$("#gl").innerHTML=f.map(g=>`<div class="card"><div class="mu">${g[0]}</div><b>${g[1]}</b><div>${g[2]}</div><div class="ex">Ex.: ${g[3]}</div></div>`).join("")||'<div class="mu">Nada encontrado.</div>'};pg();
 $("#gs").oninput=e=>{gq=e.target.value;pg()};ACT.gc=v=>{gc=v;rMais()}}
function rRank(rb){const list=Object.entries(players);
 const M={todaySec:["Tempo hoje",tdy,fmt],totalSec:["Tempo total",p=>p.totalSec||0,fmt],xp:["XP",p=>p.xp||0,v=>v],best:["Melhor rodada do quiz",p=>p.best||0,v=>v+" pts"],pct:["% de acertos",pct,v=>v+"%"],sb:["Melhor simulado",simBest,v=>v+"%"],str:["Ofensiva",streakNow,v=>v+" 🔥"]};
 const sel=`<select id="k">${Object.entries(M).map(([k,v])=>`<option value="${k}" ${k===rkey?"selected":""}>${v[0]}</option>`).join("")}</select>`;
 rb.innerHTML=`<div class="seg">${[["amigos","👥 Amigos"],["estados","🗺️ Estados"],["cmp","⚔️ Comparar"]].map(([k,t])=>`<button data-a="rs2" data-v="${k}" class="${rsub===k?"on":""}">${t}</button>`).join("")}</div><div id="rr"></div>`;
 ACT.rs2=v=>{rsub=v;rMais()};ACT.cp=v=>{cmpId=v;rsub="cmp";rMais()};const r=$("#rr");
 if(rsub==="amigos"){const [,f,fm]=M[rkey];r.innerHTML=`<div class="card">${sel}${list.sort((a,b)=>f(b[1])-f(a[1])).map(([i,p],n)=>`<div class="row" data-a="cp" data-v="${i}" style="cursor:pointer"><b style="width:26px">${["🥇","🥈","🥉"][n]||n+1}</b><span class="av">${p.av}</span><div class="grow"><div class="nm">${esc(p.name)}${i===uid?" (você)":""}</div><div class="mu">${dot(p)}${p.uf} · ${esc(stat(p).t)}</div></div><b>${fm(f(p))}</b></div>`).join("")}<div class="mu">Toque em um amigo para comparar.</div></div>`;$("#k").onchange=e=>{rkey=e.target.value;rMais()}}
 else if(rsub==="estados"){const k=rkey==="todaySec"?"todaySec":"totalSec",f=M[k][1],A={};list.forEach(([i,p])=>{(A[p.uf]??={uf:p.uf,v:0,n:0});A[p.uf].v+=f(p);A[p.uf].n++});const s=Object.values(A).sort((a,b)=>b.v-a.v),mx=s[0]?.v||1;
  r.innerHTML=`<div class="card"><h2>Ranking de estados</h2><select id="k"><option value="totalSec" ${k==="totalSec"?"selected":""}>Horas totais</option><option value="todaySec" ${k==="todaySec"?"selected":""}>Horas hoje</option></select>${s.map((a,n)=>`<div class="row"><b style="width:26px">${["🥇","🥈","🥉"][n]||n+1}</b><div class="grow"><div class="nm">${a.uf}${a.uf===me.uf?" ⭐":""} <span class="mu">${a.n} estudante${a.n>1?"s":""}</span></div><div class="bar"><i style="width:${100*a.v/mx}%"></i></div></div><b>${fmt(a.v)}</b></div>`).join("")}</div>`;$("#k").onchange=e=>{rkey=e.target.value;rMais()}}
 else{const o=list.filter(([i])=>i!==uid);if(!cmpId||!players[cmpId])cmpId=o[0]?.[0];if(!cmpId){r.innerHTML='<div class="card mu">Convide um amigo para comparar resultados.</div>';return}const q=players[cmpId];
  r.innerHTML=`<div class="card"><select id="c">${o.map(([i,p])=>`<option value="${i}" ${i===cmpId?"selected":""}>${esc(p.name)} (${p.uf})</option>`).join("")}</select><div class="cmp"><div class="nm">${me.av} Você</div><div class="nm" style="text-align:right">${esc(q.name)} ${q.av}</div></div>
  ${Object.values(M).map(([t,f,fm])=>{const a=f(me),b=f(q),m=Math.max(a,b,1);return`<div class="mu">${t}</div><div class="cmp"><div><div class="${a>b?"win":""}">${fm(a)}</div><div class="bar"><i style="width:${100*a/m}%"></i></div></div><div style="text-align:right"><div class="${b>a?"win":""}">${fm(b)}</div><div class="bar"><i style="width:${100*b/m}%"></i></div></div></div>`}).join("")}
  <h2 style="margin-top:8px">Pontos fracos</h2><div class="cmp"><div class="mu">${weakTxt(me)}</div><div class="mu" style="text-align:right">${weakTxt(q)}</div></div></div>`;$("#c").onchange=e=>{cmpId=e.target.value;rMais()}}}
const weakTxt=p=>Object.entries(p.err||{}).sort((a,b)=>b[1][0]-a[1][0]).slice(0,3).map(([c,x])=>AS[c]+" ("+x[0]+")").join(", ")||"—";

/* ---------- OFENSIVA, RADAR, CORTE, HISTÓRIA, FÓRUM ---------- */
const ymd=d=>d.toLocaleDateString("sv");
const yday=()=>{const d=new Date();d.setDate(d.getDate()-1);return ymd(d)};
const streakNow=p=>p.slast===today()||p.slast===yday()?p.streak||0:0;
function countQ(n){const t=today();if(me.qday!==t){me.qday=t;me.qn=0}me.qn=(me.qn||0)+n;if(me.qn>=5&&me.slast!==t){me.streak=me.slast===yday()?(me.streak||0)+1:1;me.slast=t;me.sbest=Math.max(me.sbest||0,me.streak);toast("🔥 Ofensiva: "+me.streak+" dia"+(me.streak>1?"s":"")+"!")}}
function streakCard(){const sk=streakNow(me),done=me.slast===today(),f=Math.max(0,5-(me.qday===today()?me.qn||0:0));
 return`<div class="card"><h2>${done?"🔥":sk?"🕯️":"🪫"} Ofensiva: ${sk} dia${sk===1?"":"s"}</h2><div class="mu">${done?"Meta de hoje cumprida! Volte amanhã para manter a chama.":sk?`Resolva mais ${f} questão(ões) hoje para a chama não apagar!`:`Resolva ${f} questões hoje para acender a chama.`}</div><div class="bar" style="margin-top:6px"><i style="width:${done?100:(5-f)*20}%"></i></div></div>`}
const AX=[["Álgebra","fx"],["Geometria","ge"],["Aritmética","npjmrqtb"],["Interpretação","IGL"],["Gramática","CSAMPVF"]];
function axval(p,cs){let e=0,t=0;for(const c of cs){const x=(p.err||{})[c];if(x){e+=x[0];t+=x[1]}}return t?Math.round(100*(1-e/t)):null}
const axes=p=>[...AX.map(a=>[a[0],axval(p,a[1])]),["Redação",p.red==null?null:p.red*10]];
function radar(p){const A=axes(p),n=6,cx=150,cy=140,R=92,pt=(i,r)=>{const a=-Math.PI/2+2*Math.PI*i/n;return[cx+r*Math.cos(a),cy+r*Math.sin(a)]};
 const ring=k=>A.map((_,i)=>pt(i,R*k).join(",")).join(" ");
 return`<svg viewBox="0 0 300 285" style="width:100%;max-width:380px;display:block;margin:auto">${[.25,.5,.75,1].map(k=>`<polygon points="${ring(k)}" fill="none" stroke="var(--bd)"/>`).join("")}${A.map((_,i)=>{const[x,y]=pt(i,R);return`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--bd)"/>`}).join("")}<polygon points="${A.map((a,i)=>pt(i,R*(a[1]||0)/100).join(",")).join(" ")}" fill="#5b5bf044" stroke="var(--pr)" stroke-width="2"/>${A.map((a,i)=>{const[x,y]=pt(i,R+20);return`<text x="${x}" y="${y}" text-anchor="middle" font-size="11" fill="var(--tx)">${a[0]}<tspan x="${x}" dy="13" fill="var(--mu)">${a[1]==null?"sem dados":a[1]+"%"}</tspan></text>`}).join("")}</svg>`}
function rPerfil(mb){const ks=axes(me).filter(a=>a[1]!=null).sort((a,b)=>a[1]-b[1]);
 mb.innerHTML=`<div class="card"><h2>📊 Radar de desempenho</h2>${radar(me)}<div class="mu" style="text-align:center">${ks.length?`Ponto mais fraco: <b>${ks[0][0]}</b> (${ks[0][1]}%).${ks.length>1?` Mais forte: ${ks[ks.length-1][0]} (${ks[ks.length-1][1]}%).`:""} Se o desenho ficar “torto”, treine o lado menor.`:"Resolva questões no quiz e nos simulados para montar seu radar."}</div></div>
 <div class="card"><h2>✍️ Redação</h2><div class="mu">Não há questão objetiva de redação, então esse eixo usa a nota de 0 a 10 que você se der (ou o professor der) na última redação.</div><input id="rd" type="number" min="0" max="10" step="0.5" value="${me.red??""}" placeholder="Nota 0 a 10"><button class="btn s" data-a="rds">Salvar</button></div>
 <div class="card"><h2>🔥 Ofensiva</h2>Atual: <b>${streakNow(me)}</b> dia(s) · Recorde: <b>${me.sbest||0}</b></div>`;
 ACT.rds=()=>{const x=parseFloat($("#rd").value);if(isNaN(x)||x<0||x>10)return toast("Digite uma nota de 0 a 10");me.red=x;save();rMais()}}
function rCorte(mb){const c=me.corte||{campus:"Natal-Central",vagas:"",cut:""};
 mb.innerHTML=`<div class="card"><h2>🏁 Simulador de corte da redação</h2><div class="mu">Regra considerada (confirme no edital do ano!): a redação só é corrigida se você não zerar nenhuma prova objetiva e ficar dentro de 3× o número de vagas do curso. <b>Não tenho os dados oficiais por campus</b>, então preencha com o resultado do ano passado do seu campus/curso (site do IFRN).</div>
 <select id="cc">${["Natal-Central","Mossoró","Parnamirim","Outro campus"].map(x=>`<option ${x===c.campus?"selected":""}>${x}</option>`).join("")}</select>
 <input id="cv" type="number" placeholder="Vagas do curso" value="${c.vagas}"><input id="ct" type="number" placeholder="Acertos (de 40) de quem ficou na última posição de corte no ano passado" value="${c.cut}">
 <button class="btn" data-a="cc2">Calcular com meu último simulado</button></div><div id="cr"></div>`;
 ACT.cc2=()=>{const h=(me.sims||[]).slice(-1)[0],v=+$("#cv").value,t=+$("#ct").value;me.corte={campus:$("#cc").value,vagas:v||"",cut:t||""};save();
  if(!h)return $("#cr").innerHTML='<div class="alert">Faça primeiro um simulado completo (40 questões).</div>';
  const pm=h.po!=null?h.ok-h.po:null;let m=[];
  if(h.po===0||pm===0)m.push('<div class="alert">❌ Você zerou uma prova objetiva: sua redação <b>não seria corrigida</b>.</div>');
  else{if(h.po==null)m.push('<div class="mu">(Simulado antigo: refaça para checar zero por prova.)</div>');
   if(t){const d=h.ok-t;m.push(d>=0?`<div class="alert" style="border-color:var(--ok)">✅ ${h.ok} acertos: <b>dentro do corte</b> do ano passado (${t}). Margem de ${d} questão(ões). Sua redação seria corrigida.</div>`:`<div class="alert">⚠️ ${h.ok} acertos: <b>${-d} abaixo</b> do corte do ano passado (${t}). A redação não seria corrigida. Foco nos pontos fracos!</div>`)}
   else m.push(`<div class="alert">Você fez ${h.ok}/40, sem zerar prova. Informe o corte do ano passado para saber se ficaria dentro.</div>`)}
  if(v)m.push(`<div class="mu">${$("#cc").value}: com ${v} vagas, a redação seria corrigida para até ${v*3} candidatos.</div>`);
  $("#cr").innerHTML=m.join("")}}
let hg=null;
const goQuiz=c=>{tab="quiz";document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.k==="quiz"));qStart(c)};
function rHist(mb){if(hg)return hgR();
 mb.innerHTML=`<div class="card" style="text-align:center"><div style="font-size:44px">🏛️</div><h2>Máquina do Tempo</h2><div class="mu">História do Brasil e do RN de um jeito divertido.</div><br><button class="btn" data-a="hs">⚡ Qual veio primeiro?</button><button class="btn" data-a="hq">🧠 Quiz de História</button><button class="btn g" data-a="hl">📜 Linha do tempo</button></div><div id="hx"></div>`;
 ACT.hs=()=>{const e=shuf(EV);hg={i:0,sc:0,res:null,qs:Array.from({length:10},(_,i)=>[e[2*i],e[2*i+1]])};hgR()};ACT.hq=()=>goQuiz("H");
 ACT.hl=()=>{$("#hx").innerHTML=EV.map(e=>`<div class="card"><b>${e[0]}</b> · ${e[1]}<div class="mu">${e[2]}</div></div>`).join("")}}
function hgR(){const mb=$("#mb");
 if(hg.i>=10){mb.innerHTML=`<div class="card" style="text-align:center"><div style="font-size:44px">${hg.sc>=8?"🏆":"📜"}</div><h2>${hg.sc}/10</h2><div class="mu">Você acertou ${hg.sc} confrontos de datas.</div><button class="btn" data-a="hs">Jogar de novo</button><button class="btn g" data-a="hb">Voltar</button></div>`;ACT.hb=()=>{hg=null;rMais()};return}
 const[a,b]=hg.qs[hg.i],f=a[0]<b[0]?0:1,r=hg.res;
 mb.innerHTML=`<div class="card"><div class="mu">Rodada ${hg.i+1}/10 · ${hg.sc} acertos</div><h2>Qual aconteceu PRIMEIRO?</h2>${[a,b].map((e,k)=>`<button class="opt ${r!=null?(k===f?"ok":k===r?"no":""):""}" data-a="hp" data-v="${k}">${e[1]}${r!=null?`<div class="mu">${e[0]} — ${e[2]}</div>`:""}</button>`).join("")}${r!=null?`<button class="btn" data-a="hn">${hg.i<9?"Próxima ▶":"Ver resultado"}</button>`:""}</div>`;
 ACT.hp=v=>{if(hg.res!=null)return;hg.res=+v;if(+v===f){hg.sc++}countQ(1);hgR()};ACT.hn=()=>{hg.i++;hg.res=null;hgR()}}
let fo={id:null,unsub:null};
ACT.fo=v=>{const box=$("#fo_"+v);if(!box)return;fo.unsub&&fo.unsub();document.querySelectorAll('[id^="fo_"]').forEach(x=>x.innerHTML="");if(fo.id===v){fo.id=null;return}
 if(!db){box.innerHTML='<div class="mu">Os comentários precisam do link convidado (login no Claude). Aqui no modo solo ficam desativados.</div>';fo.id=null;return}
 fo.id=v;box.innerHTML=`<div id="fl" class="mu" style="margin-top:6px">Carregando…</div><textarea id="ft" rows="2" placeholder="Poste sua resolução passo a passo ou tire uma dúvida…"></textarea><button class="btn s" data-a="fs" data-v="${v}">Comentar</button>`;
 fo.unsub=db.collection("qf/"+v+"/c").orderBy("ts","asc").limit(40).onSnapshot(s=>{const l=$("#fl");if(l)l.innerHTML=s.docs.map(d=>{const x=d.data(),a=players[x.from];return`<div class="box"><b>${a?a.av+" "+esc(a.name):"?"}</b><div style="white-space:pre-wrap">${esc(x.text)}</div></div>`}).join("")||"Seja o primeiro a comentar! 💡"},e=>console.error(e))};
ACT.fs=async v=>{const t=$("#ft").value.trim();if(!t)return;$("#ft").value="";try{await db.collection("qf/"+v+"/c").add({from:uid,text:t,ts:Date.now()})}catch(e){toast("Falha ao enviar")}};
/* ---------- BOOT ---------- */
(async()=>{try{
 let user=null;try{if(typeof claude!=="undefined"){const T=new Promise(r=>setTimeout(()=>r([null,null]),4000));[user,db]=await Promise.race([Promise.all([claude.use("user"),claude.use("db")]),T])}}catch(e){}
 if(db&&user){uid=await user.id();const s=await db.doc("players/"+uid).get();me=s.exists?s.data():null;if(me){me.err=me.err||{};me.sims=me.sims||[]}me?start():onboard()}
 else{db=null;solo=true;uid="solo";try{me=JSON.parse(localStorage.getItem("ij_me")||"null");draft=JSON.parse(localStorage.getItem("ij_dr")||"null")}catch(e){me=null}if(me){me.err=me.err||{};me.sims=me.sims||[]}me?start():onboard()}
}catch(e){$("#v").innerHTML='<div class="card mu">Erro ao iniciar. Reabra o link.</div>'}})();
</script></body></html>
